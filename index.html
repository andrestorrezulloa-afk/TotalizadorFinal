<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Totalizador de Venta</title>
  </head>
  <body>
    <h1>Totalizador de Venta</h1>

    <form id="totalizador-form">
      <div>
        <label for="cantidad">Cantidad de ítems:</label>
        <input type="number" id="cantidad" required />
      </div>
      <br />

      <div>
        <label for="precio">Precio por ítem:</label>
        <input type="number" id="precio" step="0.01" required />
      </div>
      <br />

      <button type="submit" id="calcular-btn">Calcular Precio Neto</button>
    </form>

    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
